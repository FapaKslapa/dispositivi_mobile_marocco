name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew :app:test
      - run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/DosageCalc-${GITHUB_REF_NAME}.apk

      - name: Extract changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > /tmp/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "DosageCalc ${{ github.ref_name }}"
          body_path: /tmp/notes.md
          files: app/build/outputs/apk/debug/DosageCalc-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
